<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Simple Chatbot — Groq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0B0E14;
  --paper: #F7F8FA;
  --paper-raised: #FFFFFF;
  --accent: #3D5AFE;
  --line: #E4E7EC;
  --text: #0B0E14;
  --text-soft: #6B7280;
  --warn: #FF6B4A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* TOP BAR */
.topbar {
  background: var(--ink);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar-title {
  color: white;
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #00C896;
}
.clear-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.8);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
}
.clear-btn:hover { background: rgba(255,255,255,0.16); }

/* KEY BAR */
.key-bar {
  background: #FFF7ED;
  border-bottom: 1px solid #FDE3C0;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #92400E;
  flex-shrink: 0;
}
.key-bar input {
  flex: 1;
  padding: 6px 9px;
  border: 1px solid #FDE3C0;
  border-radius: 6px;
  font-size: 12px;
  background: white;
  font-family: monospace;
}
.key-bar button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: var(--ink);
  color: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.key-status { font-size: 11px; white-space: nowrap; font-family: monospace; }
.key-status.ok { color: #00C896; }
.key-status.missing { color: var(--warn); }

/* CHAT AREA */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

.msg {
  max-width: 82%;
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 14.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.msg-user {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 4px;
}
.msg-bot {
  align-self: flex-start;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.msg-error {
  align-self: flex-start;
  background: #FFF0EC;
  border: 1px solid #FFD9CC;
  color: #B5341F;
}

.typing {
  align-self: flex-start;
  display: flex;
  gap: 4px;
  padding: 12px 14px;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
}
.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-soft);
  animation: bounce 1.2s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

.empty-hint {
  margin: auto;
  text-align: center;
  color: var(--text-soft);
  font-size: 13.5px;
  max-width: 260px;
  line-height: 1.6;
}

/* INPUT BAR */
.input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--line);
  background: var(--paper-raised);
  flex-shrink: 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
#userInput {
  flex: 1;
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 10px 14px;
  font-size: 14.5px;
  font-family: 'Inter', sans-serif;
  resize: none;
  max-height: 120px;
  outline: none;
  line-height: 1.4;
}
#userInput:focus { border-color: var(--accent); }
#sendBtn {
  flex-shrink: 0;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, transform 0.1s ease;
}
#sendBtn:hover:not(:disabled) { background: #3450E8; }
#sendBtn:active:not(:disabled) { transform: scale(0.94); }
#sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title"><span class="topbar-dot"></span> Simple Chatbot</div>
  <button class="clear-btn" id="clearBtn" type="button">Clear chat</button>
</div>

<div class="key-bar">
  <span>Groq key:</span>
  <input id="apiKeyInput" type="password" placeholder="Paste your Groq API key (gsk_...)" />
  <button id="saveKeyBtn" type="button">Save</button>
  <span id="keyStatus" class="key-status missing">Not set</span>
</div>

<div class="chat-area" id="chatArea">
  <div class="empty-hint" id="emptyHint">Type a question below to start chatting. Don't forget to paste your Groq API key above first.</div>
</div>

<div class="input-bar">
  <textarea id="userInput" rows="1" placeholder="Ask anything..."></textarea>
  <button id="sendBtn" type="button">➤</button>
</div>

<script>
let GROQ_API_KEY = "";
let messages = []; // {role: "user"|"assistant", content: string}

const apiKeyInput = document.getElementById("apiKeyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");
const keyStatus = document.getElementById("keyStatus");
const chatArea = document.getElementById("chatArea");
const emptyHint = document.getElementById("emptyHint");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");

let requestInFlight = false;

saveKeyBtn.addEventListener("click", () => {
  const val = apiKeyInput.value.trim();
  if (val) {
    GROQ_API_KEY = val;
    keyStatus.textContent = "Key set ✓";
    keyStatus.className = "key-status ok";
    apiKeyInput.value = "";
    apiKeyInput.placeholder = "Key saved for this session";
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function appendMessage(role, content) {
  emptyHint.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "msg-user" : role === "error" ? "msg-error" : "msg-bot");
  div.textContent = content;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping() {
  emptyHint.style.display = "none";
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typingIndicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function callGroq(userMessages) {
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${GROQ_API_KEY}`,
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: userMessages,
      temperature: 0.7,
      max_tokens: 1024,
    }),
  });

  const rawText = await response.text();
  let data;
  try {
    data = JSON.parse(rawText);
  } catch (e) {
    throw new Error("Server returned a non-JSON response: " + rawText.slice(0, 150));
  }

  if (!response.ok) {
    throw new Error(data?.error?.message || `Request failed (${response.status})`);
  }

  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error("No response content received.");
  return text;
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || requestInFlight) return;

  if (!GROQ_API_KEY) {
    appendMessage("error", "Please paste your Groq API key above and click Save first.");
    return;
  }

  requestInFlight = true;
  sendBtn.disabled = true;
  userInput.value = "";
  userInput.style.height = "auto";

  appendMessage("user", text);
  messages.push({ role: "user", content: text });

  showTyping();

  try {
    const reply = await callGroq(messages);
    hideTyping();
    appendMessage("assistant", reply);
    messages.push({ role: "assistant", content: reply });
  } catch (err) {
    hideTyping();
    appendMessage("error", err.message || "Something went wrong.");
  } finally {
    requestInFlight = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
userInput.addEventListener("input", () => {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
});

clearBtn.addEventListener("click", () => {
  messages = [];
  chatArea.innerHTML = "";
  chatArea.appendChild(emptyHint);
  emptyHint.style.display = "block";
});
</script>
</body>
</html>
